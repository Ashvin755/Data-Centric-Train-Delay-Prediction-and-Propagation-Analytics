name: Multi-Day Train Polling

on:
  schedule:
    # Run every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  poll-multi-day-trains:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run multi-day polling
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RAILRADAR_API_KEY_MULTI_DAY: ${{ secrets.RAILRADAR_API_KEY_MULTI_DAY }}
          MAX_FLAG_THRESHOLD: ${{ vars.MAX_FLAG_THRESHOLD }}
          TIMEZONE: Asia/Kolkata
        run: |
          python run_multi_day_poll.py
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-day-logs-${{ github.run_number }}
          path: logs/multi_day_*.log
          retention-days: 30
